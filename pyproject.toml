[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ti-adcevm"
version = "0.1.0"
description = "Python tools for controlling the TI ADS54J40EVM and LMK04828 evaluation board"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyftdi>=0.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]